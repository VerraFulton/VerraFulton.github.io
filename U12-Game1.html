<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Game 1 - Knights vs. Aspendale</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #0033A0; /* Royal Blue */
        color: white;
        text-align: center;
        padding-bottom: 40px;
    }

    header {
        background: #0033A0;
        padding: 20px;
        font-size: 32px;
        font-weight: bold;
        color: white;
        text-transform: uppercase;
        letter-spacing: 2px;
        border-bottom: 3px solid white;
    }

    h2 {
        margin-top: 30px;
        font-size: 26px;
        color: white;
    }

    .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 20px;
        padding: 20px;
        max-width: 1000px;
        margin: auto;
    }

    .gallery img {
        width: 100%;
        border-radius: 10px;
        border: 3px solid white;
        object-fit: cover;
    }

    a.back {
        display: inline-block;
        margin-top: 20px;
        font-size: 18px;
        color: white;
        text-decoration: none;
        font-weight: bold;
    }

    .logo {
        width: 120px;
        margin-top: 20px;
    }
</style>
</head>

<body>

<header>Game 1 - Knights vs. Aspendale</header>

<img class="logo" src="photos/Chelsea U12 Knights/logo.jpeg" alt="Team Logo">

<h2>Photo Gallery</h2>

<div class="gallery" id="gallery"></div>

<a class="back" href="U12-Knights.html">← Back to Knights Landing Page</a>

<script>
  const gallery = document.getElementById("gallery");

  const images = [
    "DSC_0188.jpg","DSC_0194.jpg","DSC_0195.jpg","DSC_0198.jpg","DSC_0223.jpg",
    "DSC_0225.jpg","DSC_0233.jpg","DSC_0234.jpg","DSC_0238.jpg","DSC_0243.jpg",
    "DSC_0246.jpg","DSC_0248.jpg","DSC_0249.jpg","DSC_0251.jpg","DSC_0260.jpg",
    "DSC_0275.jpg","DSC_0289.jpg","DSC_0290.jpg","DSC_0293.jpg","DSC_0296.jpg",
    "DSC_0303.jpg","DSC_0304.jpg","DSC_0082.jpg","DSC_0123.jpg","DSC_0178.jpg",
    "DSC_0183.jpg"
  ];

  images.forEach(file => {
    const img = document.createElement("img");
    img.src = "photos/Chelsea U12 Knights/Game 1/thumbs/" + file;
    gallery.appendChild(img);
  });
</script>

</body>
</html>
