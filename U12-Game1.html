<style>
/* --- Gallery Grid --- */
.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 12px;
  padding: 20px;
}
.gallery img {
  width: 100%;
  height: auto;
  cursor: pointer;
  border-radius: 4px;
  transition: opacity 0.2s;
}
.gallery img:hover {
  opacity: 0.8;
}

/* --- Lightbox Background --- */
#lightbox {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

/* --- Lightbox Image --- */
#lightbox img {
  max-width: 90%;
  max-height: 90%;
  border-radius: 4px;
  animation: fadeIn 0.3s ease;
}

/* --- Fade-in Animation --- */
@keyframes fadeIn {
  from { opacity: 0; transform: scale(0.97); }
  to { opacity: 1; transform: scale(1); }
}

/* --- Navigation Arrows --- */
.arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  font-size: 48px;
  color: white;
  cursor: pointer;
  user-select: none;
  padding: 20px;
}
#prev { left: 20px; }
#next { right: 20px; }
.arrow:hover { color: #ccc; }
</style>
</head>

];

let currentIndex = 0;

function openLightbox(filename) {
  currentIndex = images.indexOf(filename);
  document.getElementById("lightbox-img").src =
    `photos/Chelsea U12 Knights/Game 1 - Knights vs. Aspendale/${filename}`;
  document.getElementById("lightbox").style.display = "flex";
}

function closeLightbox(e) {
  if (e.target.id === "lightbox") {
    document.getElementById("lightbox").style.display = "none";
  }
}

function changeImage(direction) {
  currentIndex += direction;
  if (currentIndex < 0) currentIndex = images.length - 1;
  if (currentIndex >= images.length) currentIndex = 0;

  document.getElementById("lightbox-img").src =
    `photos/Chelsea U12 Knights/Game 1 - Knights vs. Aspendale/${images[currentIndex]}`;
}
</script>
