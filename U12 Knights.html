<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chelsea U12 Knights – Games</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #0033A0; /* Royal Blue */
        color: white;
        text-align: center;
        padding-bottom: 40px;
    }

    header {
        background: #0033A0;
        padding: 20px;
        font-size: 32px;
        font-weight: bold;
        color: white;
        text-transform: uppercase;
        letter-spacing: 2px;
        border-bottom: 3px solid white;
    }

    .logo {
        width: 120px;
        margin-top: 15px;
    }

    .games {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 30px;
        padding: 20px;
        max-width: 900px;
        margin: auto;
    }

    .game-card {
        background: #002b80;
        padding: 15px;
        border-radius: 12px;
        border: 3px solid white;
    }

    .game-card img {
        width: 100%;
        border-radius: 10px;
        object-fit: cover;
        border: 3px solid white;
    }

    .game-card a {
        text-decoration: none;
        color: white;
        font-size: 20px;
        font-weight: bold;
        display: block;
        margin-top: 10px;
    }
</style>
</head>

<body>

<header>
    Chelsea U12 Knights
    <br>
    <img class="logo" src="photos/Chelsea%20U12%20Knights/logo.jpeg" alt="Knights Logo">
</header>

<div class="games">

    <!-- GAME 1 -->
    <div class="game-card">
        <a href="U12-Game1.html">
            <img src="photos/Chelsea%20U12%20Knights/Game%201%20-%20Knights%20vs.%20Aspendale/DSC_0082.JPG" alt="Game 1 Thumbnail">
            Game 1 – Knights vs Aspendale
        </a>
    </div>

    <!-- GAME 2 -->
    <div class="game-card">
        <a href="U12-Game2.html">
            <img src="photos/Chelsea%20U12%20Knights/Game%202%20-%20Knights%20vs.%20Seaford/DSC_0015.JPG" alt="Game 2 Thumbnail">
            Game 2 – Knights vs Seaford
        </a>
    </div>

    <!-- GAME 3 -->
    <div class="game-card">
        <a href="U12-Game3.html">
            <img src="photos/Chelsea%20U12%20Knights/Game%203%20-%20Knights%20vs.%20Barton/DSC_0131.JPG" alt="Game 3 Thumbnail">
            Game 3 – Knights vs Barton
        </a>
    </div>

    <!-- GAME 4 -->
    <div class="game-card">
        <a href="U12-Game4.html">
            <img src="photos/Chelsea%20U12%20Knights/Game%204%20-%20Knights%20vs.%20Casey/DSC_0293.JPG" alt="Game 4 Thumbnail">
            Game 4 – Knights vs Casey
        </a>
    </div>

</div>

</body>
</html>
