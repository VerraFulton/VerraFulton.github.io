<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chelsea U12 Knights – Games </title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #0033A0; /* Royal Blue */
        color: white;
        text-align: center;
        padding-bottom: 40px;
    }

    header {
        background: #0033A0;
        padding: 20px;
        font-size: 32px;
        font-weight: bold;
        color: white;
        text-transform: uppercase;
        letter-spacing: 2px;
        border-bottom: 3px solid white;
    }

    .logo {
        width: 120px;
        margin-top: 15px;
    }

    .games {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 30px;
        padding: 20px;
        max-width: 900px;
        margin: auto;
    }

    .game-card {
        background: #002b80;
        padding: 15px;
        border-radius: 12px;
        border: 3px solid white;
    }

    .game-card img {
        width: 100%;
        border-radius: 10px;
        object-fit: cover;
        border: 3px solid white;
    }

    .game-card a {
        text-decoration: none;
        color: white;
        font-size: 20px;
        font-weight: bold;
        display: block;
        margin-top: 10px;
    }
</style>
</head>
