  <title>Chelsea U9 Cobras – Games</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0033A0; /* Royal Blue */
      color: white;
      text-align: center;
    }

    header {
      background: #00246B; /* Darker royal blue */
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      border-bottom: 4px solid white;
    }

    header img {
      height: 140px;
      margin-bottom: 10px;
    }

    header h1 {
      margin: 0;
      font-size: 36px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .game-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 30px;
      padding: 40px 20px;
    }

    .game-card {
      width: 260px;
      background: rgba(255,255,255,0.12);
      padding: 15px;
      border-radius: 12px;
      text-decoration: none;
      color: white;
      transition: 0.2s;
      border: 2px solid white;
    }

    .game-card:hover {
      background: rgba(255,255,255,0.22);
      transform: scale(1.04);
    }

    .game-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 8px;
      border: 2px solid white;
    }

    footer {
      margin: 40px 0 20px;
      opacity: 0.7;
    }
  </style>
</head>
