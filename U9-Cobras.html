<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #0033A0; /* Royal Blue */

    }

header {
  background: #00246B; /* Royal blue banner */
  padding: 30px 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  border-bottom: 4px solid white;
}

.logo-box {
  background: white;              /* White background behind logo */

  border: 3px solid #0033A0;      /* Royal blue border */

}

.logo-box img {
  height: 140px;                  /* Adjust logo size */
  display: block;
}

header h1 {
  margin: 0;
  font-size: 36px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: white;
}

    .games {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 30px;
        padding: 20px;
        max-width: 900px;
        margin: auto;
    }

    .game-card {
        background: #002b80;
        padding: 15px;
        border-radius: 12px;
        border: 4px solid #ffcc00;
    }

    .game-card img {
        width: 100%;
        border-radius: 10px;
        object-fit: cover;
        border: 3px solid #ffcc00;
    }

    .game-card a {
        text-decoration: none;
        color: white;
        font-size: 20px;
        font-weight: bold;
        display: block;
        margin-top: 10px;
    }
</style>
